import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
}

base {
    archivesName = "MesdagPortLib"
}

// Mojang ships Java 17 to end users in 1.20.1, so mods should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

boolean isRunningInIdea = System.getProperty("idea.active") == "true"

legacyForge {
    // Specify the version of MinecraftForge to use.
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
        }

        server {
            server()
//            programArgument '--nogui'
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
            jvmArguments.addAll([
                    // 忽略无效指令，避免有的人没安装 JetBrain Runtime 无法启动游戏
                    "-XX:+IgnoreUnrecognizedVMOptions",
                    // 启用 JetBrain Runtime 热重载功能
                    "-XX:+AllowEnhancedClassRedefinition",
                    // 并发修改检测
                    //"-javaagent:mods/CMESuckMyDuck-1.0.5.jar=net/minecraft/util/ClassInstanceMultiMap;byClass;Map;nonstatic"
            ])
            if (isRunningInIdea) {
                systemProperty "terminal.jline", "true"
            }
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime' and a deobfuscating one called 'modLocalRuntime'
// These configurations should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

boolean slim = true

dependencies {
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.3"))
    if (slim) {
        implementation("io.github.llamalad7:mixinextras-forge:0.5.3")
    } else {
        implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.3"))
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json"
    ])
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

java.withSourcesJar()

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifact(file('portlib-interfaceinjection.json')) {
                classifier 'interfaceinjection'
                extension 'json'
            }
        }
    }
    repositories {
        mavenLocal()
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// 为 Gradle Module Metadata 添加 interfaceinjection variant，
// 使下游项目的 interfaceInjectionData 配置能通过 variant-aware 解析找到该构件
tasks.withType(GenerateModuleMetadata).configureEach {
    def jsonFile = project.layout.projectDirectory.file('portlib-interfaceinjection.json').asFile
    def version = mod_version
    doLast {
        def file = outputFile.get().asFile
        if (!file.exists()) return
        def json = new JsonSlurper().parse(file) as Map
        json.variants.add([
            name     : 'interfaceInjectionVariant',
            attributes: [
                'org.gradle.category'           : 'interfaceinjection',
                'org.gradle.dependency.bundling': 'external',
                'org.gradle.usage'              : 'java-runtime'
            ],
            files: [[
                name : "PortLib-${version}-interfaceinjection.json",
                url  : "PortLib-${version}-interfaceinjection.json",
                size : jsonFile.length()
            ]]
        ])
        file.text = JsonOutput.prettyPrint(JsonOutput.toJson(json))
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

def refmapPath = layout.buildDirectory.file("mixin/${mod_id}.refmap.json")

tasks.register('patchRefmap') {
    dependsOn compileJava
    doLast {
        def refmapFile = refmapPath.get().asFile
        if (!refmapFile.exists()) {
            logger.warn("Refmap file not found at ${refmapFile.absolutePath}, skipping patch")
            return
        }

        def json = new JsonSlurper().parse(refmapFile) as Map

        def insertRefMap = { String m, String meth, String map ->
            if (!json.mappings[m]) json.mappings[m] = [:]
            if (!json.data.searge[m]) json.data.searge[m] = [:]
            json.mappings[m][meth] = map
            json.data.searge[m][meth] = map
        }

        insertRefMap('org/mesdag/portlib/diff/mixin/EnchantmentMenuMixin', 'lambda$clickMenuButton$1', 'Lnet/minecraft/world/inventory/EnchantmentMenu;m_39475_(Lnet/minecraft/world/item/ItemStack;ILnet/minecraft/world/entity/player/Player;ILnet/minecraft/world/item/ItemStack;Lnet/minecraft/world/level/Level;Lnet/minecraft/core/BlockPos;)V')
        insertRefMap('org/mesdag/portlib/diff/mixin/RenderBuffersMixin', 'lambda$new$1', 'Lnet/minecraft/client/renderer/RenderBuffers;m_268794_(Lit/unimi/dsi/fastutil/objects/Object2ObjectLinkedOpenHashMap;)V')

        refmapFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(json))
        logger.lifecycle('Patched refmap')
    }
}

tasks.named('jar') {
    dependsOn patchRefmap
}
